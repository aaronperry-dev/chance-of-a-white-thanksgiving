name: Build and deploy White Thanksgiving map

on:
  push:
    branches: [main]
  workflow_dispatch:          # also lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      # The inputs only change when NOAA issues new Normals (next: ~2031), so cache them: the distilled station
      # file (the 300 MB NCEI archive is read once and not kept), terrain tiles and Natural Earth boundaries.
      - name: Cache downloaded inputs
        uses: actions/cache@v4
        with:
          path: cache
          key: inputs-${{ hashFiles('config.py') }}
          restore-keys: inputs-

      # Downloads the NOAA daily normals, terrain and boundaries, then writes the map layers and data to data/.
      # To map one date instead of the Nov 22-28 average, use:  python build.py --date 11-26
      - name: Build map layers and data files
        run: python build.py

      # Publish only the web files (not the Python sources or the download cache).
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html app.js style.css leaflet.js leaflet.css proj4.js proj4leaflet.js _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
